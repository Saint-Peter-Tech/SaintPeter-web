    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../js/sessao.js"></script>

    <script>

        var grafico;

        window.onload = function () {
            validarSessao();
            carregarDashboard();
        }

        async function carregarDashboard() {

            var idEmpresa = sessionStorage.FK_EMPRESA;
            var idHospital = sessionStorage.ID_HOSPITAL;
            var idUnidade = sessionStorage.ID_UNIDADE;

            if (!idEmpresa || !idHospital || !idUnidade) {

                alert("Unidade não selecionada");

                return;

            }
            try {
                var resposta = await fetch(`/unidadeS3/${idEmpresa}/${idHospital}/${idUnidade}`);

                if (!resposta.ok) {
                    console.log("Erro HTTP ao buscar unidade:", resposta.status);
                    return;
                }

                var dados = await resposta.json();

                if (!dados || dados.erro) {
                    console.log("JSON da unidade não encontrado ou inválido:", dados);
                    document.getElementById("nomeUnidade").innerHTML = "Sem dados da unidade";
                    return;
                }

                mostrarDados(dados);

            } catch (erro) {
                console.error("Erro ao carregar dashboard:", erro);
            }

        }

        function mostrarDados(dados) {

            var totalBanco = sessionStorage.QTD_MONITORES || "--";
            var ativos = dados.monitoresAtivos ?? "--";

            document.getElementById("kpiAtivos").innerHTML = ativos + " / " + totalBanco;
            document.getElementById("nomeUnidade").innerHTML = dados.nome || "--";
            document.getElementById("ultimaAtualizacao").innerHTML = dados.ultimaAtualizacao || "--";
            var usoRede = Number(dados.usoRedePercentual || 0);

            document.getElementById("kpiGargalo").innerHTML = usoRede.toFixed(1) + "%";

            if (usoRede >= 90) {
                document.getElementById("kpiGargalo").style.color = "red";
            } else if (usoRede >= 70) {
                document.getElementById("kpiGargalo").style.color = "orange";
            } else {
                document.getElementById("kpiGargalo").style.color = "green";
            }

            document.getElementById("kpiAlerta").innerHTML = dados.emAlerta ?? "--";

            if (dados.emAlerta > 0) {
                document.getElementById("kpiAlerta").style.color = "orange";
            }

            document.getElementById("kpiCritico").innerHTML = dados.criticos ?? "--";

            if (dados.criticos > 0) {
                document.getElementById("kpiCritico").style.color = "red";
            }

            carregarAlertas(dados.monitoresEmAlertaLista || []);
            carregarGrafico(dados.trafegoRede || [], dados.redeTotalMbps);
            carregarConsumoRede(dados.monitoresConsumoRede || []);

        }
        
        function carregarConsumoRede(lista) {

            var container = document.getElementById("listaTempo");

            container.innerHTML = "";

            if (!lista || lista.length == 0) {

                container.innerHTML = "<p class='normal'>Nenhum consumo de rede registrado</p>";

                return;

            }

            for (var i = 0; i < lista.length; i++) {

                var monitor = lista[i];

                container.innerHTML += `
                    <button class="item" onclick="irParaMonitor(${monitor.id})">
                        <p><b>Monitor ${monitor.id}</b></p>
                        <p>Rede atual: ${monitor.redeAtual ?? monitor.rede ?? 0} Mb/s</p>
                    </button>
                `;

            }

        }

        function carregarGrafico(trafego, limite) {

            if (!Array.isArray(trafego)) {
                trafego = [];
            }

            var labels = [];
            var valores = [];
            var limiteNumerico = Number(limite);

            function formatarHorario(valor) {
                if (!valor) {
                    return "";
                }

                var texto = String(valor);

                if (texto.indexOf(" ") >= 0) {
                    return texto.split(" ")[1].substring(0, 8);
                }

                return texto;
            }

            for (var i = 0; i < trafego.length; i++) {
                var item = trafego[i];

                labels.push(formatarHorario(item.timestamp || (i + 1)));

                var porcentagem = Number(item.usoRedePercentual);

                if (isNaN(porcentagem)) {
                    var valor = Number(item.trafegoMbps || 0);

                    if (limiteNumerico > 0) {
                        porcentagem = (valor / limiteNumerico) * 100;
                    } else {
                        porcentagem = 0;
                    }
                }

                valores.push(Number(porcentagem.toFixed(2)));
            }

            var maiorValor = 0;

            for (var i = 0; i <valores.length; i++) {
                if (valores[i] > maiorValor) {
                    maiorValor = valores[i];
                }
            }

            var maximoGrafico = 10;

            if (maiorValor <= 1) {
                maximoGrafico = 1;
            } else if (maiorValor <= 5) {
                maximoGrafico = 5;
            } else if (maiorValor <= 10) {
                maximoGrafico = 10;
            } else if (maiorValor <= 50) {
                maximoGrafico = Math.ceil((maiorValor + 5) / 5) * 5;
            } else {
                maximoGrafico = Math.ceil((maiorValor + 20) / 10) * 10;
            }

            var datasets = [{
                label: "% de uso da rede da unidade",
                data: valores,
                borderColor: "#163599",
                backgroundColor: "transparent",
                borderWidth: 3,
                pointRadius: 5,
                pointHoverRadius: 7,
                tension: 0.2,
                fill: false
            }];

            if (maximoGrafico >= 90) {
                datasets.push({
                    label: "Limite crítico de utilização (90%)",
                    data: labels.map(function () { return 90; }),
                    type: "line",
                    borderColor: "red",
                    borderDash: [6, 4],
                    borderWidth: 2,
                    pointRadius: 0,
                    fill: false
                });
            }

            if (maximoGrafico >= 100) {
                datasets.push({
                    label: "Capacidade da rede (100%)",
                    data: labels.map(function () { return 100; }),
                    type: "line",
                    borderColor: "orange",
                    borderDash: [4, 4],
                    borderWidth: 2,
                    pointRadius: 0,
                    fill: false
                });
            }

            var ctx = document.getElementById("graficoRede");

            if (grafico) {
                grafico.destroy();
            }

            grafico = new Chart(ctx, {
                type: "line",
                data: {
                    labels: labels,
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            min: 0,
                            max: maximoGrafico,
                            ticks: {
                                callback: function (value) {
                                    return value + "%";
                                }
                            }
                        },
                        x: {
                            ticks: {
                                maxTicksLimit: 8
                            }
                        }
                    },
                    plugins: {
                        tooltip: {
                            callbacks: {
                                label: function (context) {
                                    return "Uso: " + context.raw + "%";
                                }
                            }
                        }
                    }
                }
            });
        }

        function carregarAlertas(lista) {

            var container = document.getElementById("listaAlertas");

            container.innerHTML = "";

            if (!lista || lista.length == 0) {

                container.innerHTML = `
                    <p class="normal">
                        Nenhum alerta
                    </p>
                `;

                return;
            }

            var criticos = [];
            var alertas = [];

            for (var i = 0; i < lista.length; i++) {

                if (lista[i].statusGeral == "Crítico") {
                    criticos.push(lista[i]);
                } else {
                    alertas.push(lista[i]);
                }
            }

            lista = criticos.concat(alertas);

            for (var i = 0; i < lista.length; i++) {

                var monitor = lista[i];

                var classe = "alerta";

                if (monitor.statusGeral == "Crítico") {
                    classe = "critico";
                }

                container.innerHTML += `
                    <button class="item" onclick="irParaMonitor(${monitor.id})">
                        <p><b>Monitor ${monitor.id}</b></p>
                        <p>CPU: ${monitor.cpu}%</p>
                        <p>RAM: ${monitor.ram}%</p>
                        <p class="${classe}">${monitor.statusGeral}</p>
                    </button>
                `;
            }
        }
        function irParaMonitor(idMonitor) {
            sessionStorage.ID_MONITOR = idMonitor;
            window.location.href = "./dashboardMonitorEspecifico.html";
        }
    </script>
