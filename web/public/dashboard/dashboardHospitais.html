<script>
    var listaHospitais = [];

    window.onload = function () {
        validarSessao();
        buscarDadosHospitais();
    };

    var hospitaisCarregados = 0;

    function buscarDadosHospitais() {
        var idEmpresa = sessionStorage.FK_EMPRESA;

        if (!idEmpresa) {
            console.error("FK_EMPRESA não encontrada no sessionStorage.");
            return;
        }

        fetch(`/hospital/buscarHospitais?idEmpresa=${idEmpresa}`)
            .then(function (resposta) {
                if (!resposta.ok) {
                    throw new Error("Erro na requisição de hospitais");
                }
                return resposta.json();
            })
            .then(function (hospitais) {
                listaHospitais = hospitais;

                const select = document.getElementById("select_hospital");

                select.innerHTML = '<option value="0">Todos os Hospitais</option>';

                hospitais.forEach(hospital => {
                    const option = document.createElement("option");
                    option.value = hospital.id_hospital;
                    option.textContent = hospital.nome_hospital;
                    select.appendChild(option);
                });

                select.addEventListener("change", function () {
                    filtrarPorSelect();
                });

                plotarCards(listaHospitais);
            })
            .catch(function (erro) {
                console.error("Erro ao buscar hospitais:", erro);
            });

    }

            if (!resposta.ok) return;

            const dados = await resposta.json();

            var cor = "green"
            var mensagem = "Status: Normal"

            if (totalAlertas > 100) {
                cor = "red"
                mensagem = "Status: CRÍTICO"
            } else if (totalAlertas >= 70) {
                cor = "orange"
                mensagem = "Status: Em alerta"
            }

            const divAlertas = document.getElementById(`alertas_${idHospital}`);
            divAlertas.innerHTML = `
            <div style="margin-top: 10px;">
                <span style="color: ${cor}; font-weight: bold;">
                ${mensagem} | ${totalAlertas} alertas
                </span>
            </div>
        `;

                ordenarCardsPorGravidade();
            }
        } catch (erro) {
            console.error("Erro ao carregar dados S3:", erro);
        }
    }

    function plotarCards(dados) {
        var container = containerCardHospital;
        container.innerHTML = "";

        if (dados.length === 0) {
            container.innerHTML = `<p style="color: #13347b; font-weight: bold; margin-left: 15px;">Nenhum hospital encontrado.</p>`;
            return;
        }

        dados.forEach(hospital => {
            const card = document.createElement("div");
            card.className = "cardHospital";
            card.style.cursor = "pointer";

            card.onclick = function () {
                sessionStorage.ID_HOSPITAL = hospital.id_hospital;
                console.log("Hospital salvo na sessão:", sessionStorage.ID_HOSPITAL);

                window.location.href = "./dashboardAlertasHospital.html";
            };

            card.innerHTML = `
            <div class="cardFormulario" style="width: 320px; padding: 25px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0px 4px 10px rgba(0,0,0,0.05); background-color: #fff;">
                <div style="display: flex; align-items: center; gap: 15px;">
                    <div style="background-color: #eef2fa; padding: 12px; border-radius: 8px; color: #13347b;">
                        <i class="fa-solid fa-hospital fa-2xl"></i>
                    </div>
                    <div>
                        <h3 style="font-size: 18px; font-weight: bold; margin: 0; color: #13347b;">
                            ${hospital.nome_hospital}
                        </h3>
                        <p style="font-size: 12px; color: gray; margin: 5px 0 0 0;">
                            ID: #00${hospital.id_hospital}
                        </p>
                        <div id="alertas_${hospital.id_hospital}" style="margin-top: 5px;">
                            Carregando status...
                        </div>
                    </div>
                </div>
            </div>
        `;
            container.appendChild(card);
            buscarAlertasS3(hospital.id_hospital, sessionStorage.FK_EMPRESA);
        });
    }

    function filtrarPorSelect() {
        const idHospital = select_hospital.value;
        const hospitalPesquisado = input_busca.value.toLowerCase().trim();

        const hospitaisFiltrados = listaHospitais.filter(hospital => {
            const hospitalEncontrado = (idHospital === "0" || hospital.id_hospital == idHospital);

            const nomeHospital = hospital.nome_hospital.toLowerCase().includes(hospitalPesquisado);
            return hospitalEncontrado && nomeHospital;
        });
        plotarCards(hospitaisFiltrados);
    }

    function ordenarHospitais() {
        var container = document.getElementById("containerCardHospital");
        var cards = Array.from(container.getElementsByClassName("cardHospital")); // Convertendo os cards em um vetor

        cards.sort((hospitalA, hospitalB) => {
            var totalHospitalA = Number(hospitalA.getAttribute("data-total") || 0);
            var totalHospitalB = Number(hospitalB.getAttribute("data-total") || 0);

            return totalHospitalB - totalHospitalA;
        });

        cards.forEach(card => container.appendChild(card));
    }
</script>
